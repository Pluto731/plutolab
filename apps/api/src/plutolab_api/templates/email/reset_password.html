<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>重置你的 PlutoLab 密码</title>
  </head>
  <body
    style="margin:0;padding:0;background:#f5f3ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#1f2937;"
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background:#f5f3ff;padding:40px 16px;"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="560"
            cellpadding="0"
            cellspacing="0"
            style="max-width:560px;background:#ffffff;border-radius:16px;box-shadow:0 12px 32px rgba(124,58,237,0.08);overflow:hidden;"
          >
            <!-- Brand header -->
            <tr>
              <td
                style="background:linear-gradient(135deg,#7c3aed 0%,#d946ef 55%,#ec4899 100%);padding:32px 40px;color:#ffffff;"
              >
                <div style="font-size:20px;font-weight:600;letter-spacing:0.3px;">
                  🪐 PlutoLab
                </div>
                <div style="margin-top:6px;font-size:13px;opacity:0.85;">
                  Your AI Workshop
                </div>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding:36px 40px 8px 40px;">
                <h1 style="margin:0 0 16px 0;font-size:22px;font-weight:600;color:#111827;">
                  重置你的密码
                </h1>
                <p style="margin:0 0 16px 0;font-size:15px;line-height:1.7;color:#374151;">
                  我们收到了一个重置 PlutoLab 账号密码的请求。点击下方按钮即可设置新密码：
                </p>

                <div style="margin:28px 0;text-align:center;">
                  <a
                    href="{{ reset_url }}"
                    style="display:inline-block;padding:14px 36px;background:linear-gradient(135deg,#7c3aed 0%,#ec4899 100%);color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;border-radius:10px;box-shadow:0 6px 18px rgba(124,58,237,0.35);"
                    >设置新密码</a
                  >
                </div>

                <p style="margin:0 0 12px 0;font-size:13px;line-height:1.7;color:#6b7280;">
                  按钮无法点击？复制下面的链接到浏览器：
                </p>
                <p
                  style="margin:0 0 24px 0;font-size:13px;line-height:1.6;color:#7c3aed;word-break:break-all;"
                >
                  {{ reset_url }}
                </p>

                <div
                  style="margin:20px 0 0 0;padding:14px 18px;background:#fdf4ff;border-left:3px solid #d946ef;border-radius:6px;font-size:13px;line-height:1.6;color:#6b21a8;"
                >
                  这个链接将在 <strong>{{ ttl_minutes }} 分钟</strong> 后失效。如果不是你本人操作，请忽略这封邮件，你的密码不会被改动。
                </div>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="padding:24px 40px 32px 40px;font-size:12px;color:#9ca3af;border-top:1px solid #f3e8ff;"
              >
                此邮件为系统自动发送，请勿直接回复。
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
