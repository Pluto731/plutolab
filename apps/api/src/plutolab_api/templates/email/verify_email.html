<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>验证你的 PlutoLab 邮箱</title>
  </head>
  <body
    style="margin:0;padding:0;background:#eff6ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#1f2937;"
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background:#eff6ff;padding:40px 16px;"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="560"
            cellpadding="0"
            cellspacing="0"
            style="max-width:560px;background:#ffffff;border-radius:16px;box-shadow:0 12px 32px rgba(59,130,246,0.10);overflow:hidden;"
          >
            <!-- Brand header -->
            <tr>
              <td
                style="background:linear-gradient(135deg,#3b82f6 0%,#06b6d4 55%,#10b981 100%);padding:32px 40px;color:#ffffff;"
              >
                <div style="font-size:20px;font-weight:600;letter-spacing:0.3px;">
                  🪐 PlutoLab
                </div>
                <div style="margin-top:6px;font-size:13px;opacity:0.9;">
                  欢迎加入 — 你的 AI 工作台
                </div>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding:36px 40px 8px 40px;">
                <h1 style="margin:0 0 16px 0;font-size:22px;font-weight:600;color:#111827;">
                  确认你的邮箱地址
                </h1>
                <p style="margin:0 0 16px 0;font-size:15px;line-height:1.7;color:#374151;">
                  你刚刚注册了 PlutoLab。点击下方按钮完成邮箱验证，开启你的 AI 工作之旅：
                </p>

                <div style="margin:28px 0;text-align:center;">
                  <a
                    href="{{ verify_url }}"
                    style="display:inline-block;padding:14px 36px;background:linear-gradient(135deg,#3b82f6 0%,#10b981 100%);color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;border-radius:10px;box-shadow:0 6px 18px rgba(16,185,129,0.32);"
                    >验证邮箱</a
                  >
                </div>

                <p style="margin:0 0 12px 0;font-size:13px;line-height:1.7;color:#6b7280;">
                  按钮无法点击？复制下面的链接到浏览器：
                </p>
                <p
                  style="margin:0 0 24px 0;font-size:13px;line-height:1.6;color:#0891b2;word-break:break-all;"
                >
                  {{ verify_url }}
                </p>

                <div
                  style="margin:20px 0 0 0;padding:14px 18px;background:#ecfeff;border-left:3px solid #06b6d4;border-radius:6px;font-size:13px;line-height:1.6;color:#155e75;"
                >
                  这个链接将在 <strong>{{ ttl_hours }} 小时</strong> 后失效。如果不是你本人注册，请忽略此邮件。
                </div>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="padding:24px 40px 32px 40px;font-size:12px;color:#9ca3af;border-top:1px solid #e0f2fe;"
              >
                此邮件为系统自动发送，请勿直接回复。
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
