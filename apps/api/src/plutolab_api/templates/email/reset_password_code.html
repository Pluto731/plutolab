<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>PlutoLab 密码修改验证码</title>
  </head>
  <body
    style="margin:0;padding:0;background:#f5f3ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#1f2937;"
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background:#f5f3ff;padding:40px 16px;"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="560"
            cellpadding="0"
            cellspacing="0"
            style="max-width:560px;background:#ffffff;border-radius:16px;box-shadow:0 12px 32px rgba(124,58,237,0.08);overflow:hidden;"
          >
            <!-- Brand header -->
            <tr>
              <td
                style="background:linear-gradient(135deg,#7c3aed 0%,#d946ef 55%,#ec4899 100%);padding:32px 40px;color:#ffffff;"
              >
                <div style="font-size:20px;font-weight:600;letter-spacing:0.3px;">
                  🪐 PlutoLab
                </div>
                <div style="margin-top:6px;font-size:13px;opacity:0.85;">
                  Your AI Workshop
                </div>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding:36px 40px 8px 40px;">
                <h1 style="margin:0 0 16px 0;font-size:22px;font-weight:600;color:#111827;">
                  密码修改验证码
                </h1>
                <p style="margin:0 0 24px 0;font-size:15px;line-height:1.7;color:#374151;">
                  我们收到了一个修改 PlutoLab 账号密码的请求。在浏览器里输入下方 6 位验证码以完成修改：
                </p>

                <!-- Code box -->
                <div
                  style="margin:28px auto;padding:24px 32px;background:linear-gradient(135deg,#faf5ff 0%,#fdf2f8 100%);border:1px solid #e9d5ff;border-radius:12px;text-align:center;"
                >
                  <div
                    style="font-family:'SF Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;font-size:36px;font-weight:700;letter-spacing:0.4em;color:#7c3aed;padding-left:0.4em;"
                  >
                    {{ code }}
                  </div>
                  <div style="margin-top:8px;font-size:12px;color:#9333ea;letter-spacing:0.1em;">
                    {{ ttl_minutes }} 分钟内有效
                  </div>
                </div>

                <div
                  style="margin:24px 0 0 0;padding:14px 18px;background:#fef2f2;border-left:3px solid #f87171;border-radius:6px;font-size:13px;line-height:1.6;color:#991b1b;"
                >
                  <strong>如果不是你本人操作</strong>，请<strong>忽略此邮件</strong>，并立即登录账号检查安全设置 — 密码不会被修改。
                </div>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="padding:24px 40px 32px 40px;font-size:12px;color:#9ca3af;border-top:1px solid #f3e8ff;"
              >
                此邮件为系统自动发送，请勿直接回复。
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
