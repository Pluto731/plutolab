packages:
  - 'apps/web'
  - 'apps/api'
  - 'packages/*'
# web-lab 不参与 workspace (独立 npm install, 避免 NTFS + pnpm lightningcss 翻车)

allowBuilds:
  sharp: true

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# React Flow uses Zustand 4; its store shim must support the workspace React 19.
overrides:
  'zustand@4>use-sync-external-store': ^1.6.0
